<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Scores</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<meta name="theme-color" content="#1d2140">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout : une colonne mobile, classement en haut, une carte par joueur, barre d'actions fixe en bas */
:root{
  --bg:#eef0f7; --surface:#ffffff; --ink:#1d2140; --muted:#666b8c; --line:#d9dcea;
  --accent:#f2b705; --accent-ink:#1d2140; --chip:#e4e7f3; --bad:#d63c3c; --good:#1f9d5b;
  --display:"Bowlby One SC","Arial Black",sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141730; --surface:#20244a; --ink:#f1f2fa; --muted:#a3a8cc; --line:#33386a;
  --accent:#ffc82e; --accent-ink:#141730; --chip:#2c3160; --bad:#ef5a5a; --good:#3cc47c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141730; --surface:#20244a; --ink:#f1f2fa; --muted:#a3a8cc; --line:#33386a;
  --accent:#ffc82e; --accent-ink:#141730; --chip:#2c3160; --bad:#ef5a5a; --good:#3cc47c; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-size:34px;margin:4px 0 0;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
h1 .seven{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 10px}
.sub{color:var(--muted);font-size:14px;margin:0}
h2{font-family:var(--display);font-size:18px;margin:8px 0 0;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);background:var(--chip);min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink)}
button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.nums{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nums button{padding:0;font-size:18px;font-variant-numeric:tabular-nums}
.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mods button{padding:0;font-size:15px}
.on{background:var(--accent)!important;color:var(--accent-ink)!important}
.bust-on{background:var(--bad)!important;color:#fff!important}
.pname{font-weight:800;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--good);color:#fff;white-space:nowrap}
.pill.b{background:var(--bad)}
.locked{opacity:.35;pointer-events:none}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .r{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;grid-column:2/4}
.bar i{display:block;height:100%;background:var(--accent)}
.pos{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.win{background:var(--accent);color:var(--accent-ink);border:0;text-align:center}
.win b{font-family:var(--display);font-size:24px;font-weight:400;display:block}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .row{max-width:560px;margin:0 auto}
.dock button{flex:1}
.hint{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){button{transition:transform .08s}button:active{transform:scale(.96)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden></div>

<script>
const TARGET=200, BONUS=15, MODS=[2,4,6,8,10], KEY='flip7-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const blank=()=>({players:[],rounds:[],phase:'setup',draft:null,edit:null});
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||!S.players)S=blank();
let ask=null; // action en attente de confirmation
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const empty=()=>({nums:[],x2:false,mods:[],bust:false});
const newDraft=()=>Object.fromEntries(S.players.map(p=>[p.id,empty()]));
function score(e){ if(!e||e.bust)return 0; let s=e.nums.reduce((a,b)=>a+b,0); if(e.x2)s*=2;
  s+=e.mods.reduce((a,b)=>a+b,0); if(e.nums.length===7)s+=BONUS; return s; }
const total=id=>S.rounds.reduce((a,r)=>a+score(r[id]),0);
function winner(){ const t=S.players.map(p=>({p,t:total(p.id)})); return t.some(x=>x.t>=TARGET)?t.sort((a,b)=>b.t-a.t)[0]:null; }
const app=document.getElementById('app'), dock=document.getElementById('dock');

function render(){ save(); S.phase==='setup'?setup():game(); }

function setup(){
  dock.hidden=true;
  app.innerHTML=`
  <h1>Flip <span class="seven">7</span></h1>
  <p class="sub">Compteur de points · objectif ${TARGET}</p>
  <h2>Joueurs</h2>
  <div class="card">
    ${S.players.map((p,i)=>`<div class="row">
      <input id="n-${p.id}" value="${esc(p.name)}" aria-label="Nom du joueur ${i+1}" onchange="ren('${p.id}',this.value)">
      <button class="ghost" aria-label="Supprimer" onclick="del('${p.id}')">✕</button></div>`).join('')||'<p class="sub">Ajoute au moins deux joueurs.</p>'}
    <div class="row">
      <input id="newName" placeholder="Ajouter un joueur" onkeydown="if(event.key==='Enter')add()">
      <button class="pri" onclick="add()" aria-label="Ajouter">＋</button>
    </div>
  </div>
  <button class="pri" ${S.players.length<2?'disabled class="pri locked"':''} onclick="start()">Lancer la partie</button>
  <p class="hint">Les scores restent enregistrés sur ce téléphone.</p>`;
}

function game(){
  if(!S.draft)S.draft=newDraft();
  const w=winner(), editing=S.edit!==null;
  const rk=[...S.players].map(p=>({p,t:total(p.id)})).sort((a,b)=>b.t-a.t);
  let h=`<h1>Flip <span class="seven">7</span></h1>`;
  if(w&&!editing) h+=`<div class="card win"><b>${esc(w.p.name)} gagne</b>avec ${w.t} points en ${S.rounds.length} manches</div>`;
  h+=`<div class="card rank">${rk.map((x,i)=>`<div class="r">
      <span class="pos">${i+1}</span><span class="pname">${esc(x.p.name)}</span><span class="pts">${x.t}</span>
      <span></span><span class="bar"><i style="width:${Math.min(100,x.t/TARGET*100)}%"></i></span></div>`).join('')}
    <p class="hint" style="margin:0">Objectif ${TARGET} points</p></div>`;
  if(!w||editing){
    const n=editing?S.edit+1:S.rounds.length+1;
    h+=`<h2>${editing?'Correction de la manche':'Manche'} ${n}</h2>`;
    S.players.forEach(p=>{
      const e=S.draft[p.id]||(S.draft[p.id]=empty()), f7=e.nums.length===7&&!e.bust;
      h+=`<div class="card">
        <div class="row between"><span class="pname">${esc(p.name)}</span>
          <span class="row">${f7?'<span class="pill">Flip 7 +15</span>':''}${e.bust?'<span class="pill b">Sauté</span>':''}<span class="pts">${score(e)}</span></span></div>
        <div class="${e.bust?'locked':''}" style="display:flex;flex-direction:column;gap:6px">
          <div class="nums">${Array.from({length:13},(_,i)=>`<button class="${e.nums.includes(i)?'on':''}" onclick="num('${p.id}',${i})">${i}</button>`).join('')}</div>
          <div class="mods"><button class="${e.x2?'on':''}" onclick="x2('${p.id}')">×2</button>${MODS.map(m=>`<button class="${e.mods.includes(m)?'on':''}" onclick="mod('${p.id}',${m})">+${m}</button>`).join('')}</div>
        </div>
        <button class="${e.bust?'bust-on':'ghost'}" onclick="bust('${p.id}')">${e.bust?'Annuler « sauté »':'Sauté (0 point)'}</button>
      </div>`;
    });
    h+=`<button class="pri" onclick="validate()">${editing?'Enregistrer la correction':'Valider la manche'}</button>`;
    if(editing)h+=`<button class="ghost" onclick="cancelEdit()">Annuler la correction</button>`;
  }
  if(S.rounds.length){
    h+=`<h2>Historique</h2><div class="card tbl"><table><tr><th>Manche</th>${S.players.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th></th></tr>
      ${S.rounds.map((r,i)=>`<tr><td>${i+1}</td>${S.players.map(p=>{const e=r[p.id];return `<td>${e&&e.bust?'Sauté':score(e)}${e&&!e.bust&&e.nums.length===7?' ★':''}</td>`}).join('')}
      <td><button class="ghost" style="min-height:36px;padding:4px 10px" onclick="editR(${i})" aria-label="Corriger la manche ${i+1}">✎</button></td></tr>`).join('')}
      <tr><th>Total</th>${S.players.map(p=>`<th>${total(p.id)}</th>`).join('')}<th></th></tr></table></div>`;
  }
  app.innerHTML=h;
  dock.hidden=false;
  dock.innerHTML= ask
    ? `<div class="row"><button class="ghost" onclick="ask=null;render()">Annuler</button>
       <button class="${ask==='reset'?'bad':'pri'}" onclick="doAsk()">${ask==='reset'?'Oui, tout effacer':'Oui, nouvelle partie'}</button></div>`
    : `<div class="row"><button class="pri" onclick="ask='new';render()">Nouvelle partie</button>
       <button class="ghost" onclick="ask='reset';render()">Réinitialiser</button></div>`;
}

function add(){const i=document.getElementById('newName'),n=i.value.trim(); if(!n)return; S.players.push({id:uid(),name:n}); render(); document.getElementById('newName').focus();}
function ren(id,n){const p=S.players.find(p=>p.id===id); if(n.trim())p.name=n.trim(); render();}
function del(id){S.players=S.players.filter(p=>p.id!==id); render();}
function start(){if(S.players.length<2)return; S.phase='game'; S.rounds=[]; S.draft=newDraft(); S.edit=null; render(); scrollTo(0,0);}
function num(id,n){const e=S.draft[id]; if(e.nums.includes(n))e.nums=e.nums.filter(x=>x!==n); else if(e.nums.length<7)e.nums.push(n); render();}
function x2(id){S.draft[id].x2=!S.draft[id].x2; render();}
function mod(id,m){const e=S.draft[id]; e.mods=e.mods.includes(m)?e.mods.filter(x=>x!==m):[...e.mods,m]; render();}
function bust(id){S.draft[id].bust=!S.draft[id].bust; render();}
function validate(){const r=JSON.parse(JSON.stringify(S.draft)); if(S.edit!==null){S.rounds[S.edit]=r;S.edit=null}else S.rounds.push(r); S.draft=newDraft(); render(); scrollTo({top:0,behavior:'smooth'});}
function editR(i){S.edit=i; S.draft=JSON.parse(JSON.stringify(S.rounds[i])); S.players.forEach(p=>{if(!S.draft[p.id])S.draft[p.id]=empty()}); render(); scrollTo({top:0,behavior:'smooth'});}
function cancelEdit(){S.edit=null; S.draft=newDraft(); render();}
function doAsk(){
  if(ask==='new'){S.rounds=[];S.draft=newDraft();S.edit=null}
  else {S=blank()}
  ask=null; render(); scrollTo(0,0);
}
// garde l'écran allumé pendant la partie si le navigateur l'autorise
try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}
render();
</script>

</body>
</html>
